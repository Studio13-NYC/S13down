name: macOS prototype

on:
  workflow_dispatch:
  push:
    branches: [codex/macos-port]
    paths: ['src/**', 'src-tauri/**', 'tests/**', 'package*.json', '*.config.ts', '.github/workflows/macos.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm test
      - run: npm run test:ui -- --max-failures=2
      - name: Keep browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-browser-failure-details
          path: test-results/
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build universal Mac app and disk image
        run: npm run tauri -- build --target universal-apple-darwin
      - name: Check bundle, architectures, and ad-hoc signature
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/S13down.app
          plutil -lint "$APP/Contents/Info.plist"
          lipo "$APP/Contents/MacOS/S13down" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" S13down-mac-universal.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: S13down-mac-universal-prototype
          if-no-files-found: error
          path: |
            S13down-mac-universal.app.zip
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            docs/MAC-QA.md
            tests/fixtures/macos-qa.md
            tests/fixtures/macos-second.markdown
