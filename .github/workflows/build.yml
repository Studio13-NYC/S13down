name: Desktop builds

on:
  workflow_dispatch:
  push:
    branches: [main, codex/macos-port]
    paths: ['src/**', 'src-tauri/**', 'tests/**', 'package*.json', '*.config.ts', '.github/workflows/build.yml']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: mac-universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-2022
            platform: windows-x64
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm test
      - run: npm run test:ui -- --max-failures=2
      - name: Keep browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-details-${{ matrix.platform }}
          path: test-results/
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build universal Mac app and disk image
        if: runner.os == 'macOS'
        run: npm run tauri -- build --target universal-apple-darwin
      - name: Check bundle, architectures, and ad-hoc signature
        if: runner.os == 'macOS'
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/S13down.app
          plutil -lint "$APP/Contents/Info.plist"
          lipo "$APP/Contents/MacOS/S13down" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$APP"
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          ditto -c -k --keepParent "$APP" "release-assets/S13down_${VERSION}_universal.app.zip"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg release-assets/
      - name: Build Windows executable and installer
        if: runner.os == 'Windows'
        run: npm run tauri -- build
      - name: Collect Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/S13down.exe -Destination release-assets/S13down.exe
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer.' }
          Copy-Item -LiteralPath $installers[0].FullName -Destination release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: S13down-${{ matrix.platform }}
          if-no-files-found: error
          path: release-assets/
